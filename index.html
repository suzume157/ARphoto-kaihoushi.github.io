
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, minimum-scale=1.0,
          user-scalable=no">

    <title>Markerless AR Test</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div id="ar-controls" class="screenshot-ignore">
        <span id="scale-value">100%</span>
        <input type="range"
               id="scale-slider"
               min="0.1"
               max="5.0"
               step="0.1"
               value="1.0">
    </div>

    <a-scene
        embedded
        webxr="requiredFeatures: hit-test, local-floor;
               optionalFeatures: dom-overlay;
               overlayElement: body"
        ar-hit-test="target: #ar-model; type: footprint"
        renderer="colorManagement: true;
                  preserveDrawingBuffer: true"
        vr-mode-ui="enabled: true">

        <a-assets>
            <a-asset-item
                id="ARmodel"
                src="./models/mao.glb">
            </a-asset-item>
        </a-assets>

        <!-- 最初は非表示。実空間の面をタップして配置 -->
        <a-entity
            id="ar-model"
            gltf-model="#ARmodel"
            scale="1 1 1"
            rotation="-20 0 0"
            animation-mixer
            visible="false">
        </a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <button id="model-switch-button"
            class="screenshot-ignore">
        モデル切替
    </button>

    <button id="screenshot-button"
            class="screenshot-ignore">
        📷
    </button>

    <script src="./js/ar-model-controller.js"></script>
    <script src="./js/screenshot-controller.js"></script>
    <script src="./js/model-switcher.js"></script>

</body>
</html>
